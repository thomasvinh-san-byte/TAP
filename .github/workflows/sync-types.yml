name: Sync Supabase types

on:
  workflow_dispatch:
  schedule:
    # Tous les jours à 3h UTC (7h Réunion) — filet de sécurité quotidien
    - cron: '0 3 * * *'
  workflow_run:
    # Auto-déclenché après chaque CD push réussi sur main (post-migration).
    # Évite que types.gen.ts reste désynchronisé après un merge de migration.
    workflows: ["CD"]
    types:
      - completed
    branches:
      - main

jobs:
  sync:
    name: Régénérer types.gen.ts
    runs-on: ubuntu-latest
    # Permissions explicites requises par peter-evans/create-pull-request@v6.
    # Default policy GitHub depuis 2023 = contents: read partout sauf
    # explicite. Sans ces permissions, peter-evans échoue silencieusement
    # 403 sur GitHub API (pas de PR auto créée).
    permissions:
      contents: write
      pull-requests: write
    # workflow_run se déclenche peu importe succès/échec — filtrer ici.
    # workflow_dispatch et schedule passent toujours (event_name différent).
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Générer les types depuis le projet distant
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase gen types typescript \
            --project-id ${{ secrets.SUPABASE_PROJECT_REF }} \
            > packages/database/src/types.gen.ts
      - name: Créer une PR si diff
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/sync-supabase-types
          base: main
          commit-message: 'chore(database): sync types Supabase'
          title: 'chore(database): sync types Supabase'
          body: |
            Régénération automatique de `packages/database/src/types.gen.ts` depuis le projet Supabase de production.

            Déclenchée par :
            - `workflow_dispatch` (manuel) OU
            - `schedule` (cron quotidien 3h UTC, filet de sécurité) OU
            - `workflow_run` après CD push réussi sur main (post-migration).
          delete-branch: true
