name: CD

on:
  push:
    branches: [main]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-migrations:
    name: Application des migrations Supabase (production)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Lier le projet
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
      - name: Pousser les migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked
      - name: Appliquer le seed (auth + démo)
        # Idempotent : tous les INSERT utilisent ON CONFLICT DO NOTHING.
        # seed.sql crée 3 comptes démo + 1 organization.
        # seed.demo.sql ajoute 10 patients fictifs réunionnais (preview/staging).
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          PROJECT_REF="${{ secrets.SUPABASE_PROJECT_REF }}"
          # Connection pooler (port 5432, IPv4) — disponible sur tous les plans
          PGHOST="aws-0-eu-central-1.pooler.supabase.com"
          PGPORT=5432
          PGDATABASE=postgres
          PGUSER="postgres.${PROJECT_REF}"
          export PGHOST PGPORT PGDATABASE PGUSER PGPASSWORD
          echo "→ Application supabase/seed.sql"
          psql -v ON_ERROR_STOP=1 -f supabase/seed.sql
          echo "→ Application supabase/seed.demo.sql"
          psql -v ON_ERROR_STOP=1 -f supabase/seed.demo.sql
          echo "✓ Seed appliqué"

  deploy-edge-functions:
    name: Déploiement Edge Functions Supabase (production)
    needs: deploy-migrations
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Lier le projet
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
      - name: Déployer la fonction nir
        # Edge Function chiffrement NIR (Phase 1 PLAN-3).
        # Les secrets APP_NIR_ENCRYPTION_KEY + APP_NIR_SEARCH_KEY
        # doivent être posés AVANT (via setup-vercel.yml workflow).
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy nir \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} \
            --no-verify-jwt false

  deploy-vercel:
    name: Déploiement Vercel (production)
    needs: deploy-migrations
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Déclencher le deploy Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
