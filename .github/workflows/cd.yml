name: CD

on:
  push:
    branches: [main]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-migrations:
    name: Application des migrations Supabase (production)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        # DEPLOY-02 : version épinglée (série 2.109, récente — corrige
        # l'application en pipeline de certaines instructions, dont la création
        # d'index concurrente) + résolution AUTHENTIFIÉE via le jeton d'exécution
        # intégré, pour éviter les échecs intermittents par dépassement de la
        # limite d'appels non authentifiés à l'API GitHub.
        with:
          version: 2.109.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Lier le projet
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
      - name: Pousser les migrations (critique, bloquant)
        # SEULE opération critique du déploiement : applique les migrations au
        # schéma de production. Si elle échoue, le déploiement DOIT échouer (on
        # ne déploie pas de code sur un schéma non migré). La conclusion du job
        # deploy-migrations ne dépend QUE de cette étape (le seed a été déplacé
        # dans le job seed-demo, non bloquant — INFRA-02).
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "→ supabase db push --linked (critique)"
          supabase db push --linked

  seed-demo:
    name: Application du seed de démo (non bloquant)
    needs: deploy-migrations
    runs-on: ubuntu-latest
    environment: production
    # Non-bloquant (INFRA-02) : le seed (comptes démo + patients fictifs) est
    # idempotent (ON CONFLICT DO NOTHING) et NON critique. Son échec (connexion
    # pooler, secret, IPv4, région) ne doit JAMAIS faire échouer le déploiement
    # ni bloquer le sync-types post-CD. Le succès du déploiement est déterminé
    # par `db push` seul (job deploy-migrations). Même posture que
    # deploy-edge-functions.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Appliquer le seed (auth + démo)
        # Idempotent : tous les INSERT utilisent ON CONFLICT DO NOTHING.
        # seed.sql crée 3 comptes démo + 1 organization.
        # seed.demo.sql ajoute 10 patients fictifs réunionnais.
        #
        # Connection via Supavisor pooler session mode (port 5432, IPv4) —
        # GitHub Actions runners n'ont pas d'IPv6 → direct connection
        # (db.<ref>.supabase.co) impossible sur Free plan sans IPv4 add-on.
        #
        # Le hostname pooler dépend de la région du projet (aws-0-<region>).
        # Récupéré dynamiquement via API Supabase pour éviter le hardcode
        # qui causait FATAL: Tenant or user not found.
        #
        # Logique de connexion INCHANGÉE (INFRA-02) : seul le couplage au job
        # critique a été retiré. En cas d'échec, ce job apparaît en échec (annoté
        # warning) mais n'affecte ni la conclusion du déploiement ni le sync.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -e
          echo "ℹ Seed non bloquant : un échec ici n'échoue PAS le déploiement."
          PROJECT_REF="${{ secrets.SUPABASE_PROJECT_REF }}"

          echo "→ Récupération région projet via Supabase API"
          REGION=$(curl -fsSL \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF" \
            | jq -r '.region')

          if [ -z "$REGION" ] || [ "$REGION" = "null" ]; then
            echo "❌ Région introuvable (seed ignoré, non bloquant). SUPABASE_PROJECT_REF correct ?"
            exit 1
          fi
          echo "  region: $REGION"

          PGHOST="aws-0-${REGION}.pooler.supabase.com"
          PGPORT=5432
          PGDATABASE=postgres
          PGUSER="postgres.${PROJECT_REF}"
          export PGHOST PGPORT PGDATABASE PGUSER PGPASSWORD

          echo "→ Test connection (fail fast)"
          psql -v ON_ERROR_STOP=1 -c "SELECT 'connected' AS status, current_database() AS db, current_user AS usr;"

          echo "→ Application supabase/seed.sql"
          psql -v ON_ERROR_STOP=1 -f supabase/seed.sql

          echo "→ Application supabase/seed.demo.sql"
          psql -v ON_ERROR_STOP=1 -f supabase/seed.demo.sql

          echo "✓ Seed appliqué"

  deploy-edge-functions:
    name: Déploiement Edge Functions Supabase (production)
    needs: deploy-migrations
    runs-on: ubuntu-latest
    environment: production
    # Non-bloquant : si la fonction nir n'a pas ses secrets (APP_NIR_*) posés
    # via setup-vercel.yml, le deploy peut échouer. On veut que la migration
    # passe quand même pour que la DB tourne. La fonction nir n'est utilisée
    # que pour le chiffrement NIR (création patient avec NIR rempli).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        # DEPLOY-02 : version épinglée (série 2.109, récente — corrige
        # l'application en pipeline de certaines instructions, dont la création
        # d'index concurrente) + résolution AUTHENTIFIÉE via le jeton d'exécution
        # intégré, pour éviter les échecs intermittents par dépassement de la
        # limite d'appels non authentifiés à l'API GitHub.
        with:
          version: 2.109.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Lier le projet
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
      - name: Déployer la fonction nir
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy nir \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} \
            --no-verify-jwt=false

  # NOTE : le job deploy-vercel a été retiré.
  # Vercel déploie automatiquement à chaque push sur main via son intégration
  # native GitHub (configurée dans Vercel Dashboard → Settings → Git). Pas
  # besoin de doublonner avec un job CI. L'ancien job échouait sur "Multiple
  # versions of pnpm specified" car packageManager dans package.json (9.12.0)
  # entrait en conflit avec version: 9 dans pnpm/action-setup@v4.
