name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20

jobs:
  install:
    name: Installation des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: Vérification des types
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Tests unitaires
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  rls-tests:
    name: Tests RLS pgTAP
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Version épinglée (D3) — `latest` provoquait un drift non
          # déterministe du runner pgTAP. Pin = CI reproductible.
          version: 2.98.2
      - run: supabase db start
      - run: supabase test db
      - if: always()
        # `--no-backup` n'existe pas dans la CLI épinglée (2.98.2) : la commande
        # échouait (« unknown flag ») et masquait le vrai résultat de `test db`.
        # `db stop` seul suffit en CI (conteneur jetable).
        run: supabase db stop

  # -------------------------------------------------------------------------
  # DÉSACTIVÉ (rouge non actionnable retiré du fil — voir consigne « rouge =
  # action requise »). Le `webServer` de playwright.config.ts lance
  # `pnpm dev` + `supabase functions serve nir --env-file .env.local`, qui
  # exige un Supabase LOCAL et un `.env.local` que ce job ne fournit pas (il ne
  # lance pas `supabase db start`). Le serveur ne démarre donc jamais : échec
  # d'INFRA, pas de régression de code. Ce n'est pas fiabilisable à court terme
  # dans ce job (il faudrait y stand-up un stack Supabase complet).
  #
  # Le golden path est déjà couvert par le smoke sur preview quand celui-ci est
  # fiabilisé (preview-smoke.yml). Pour RÉACTIVER : définir la variable de dépôt
  # `RUN_E2E_PLAYWRIGHT=true` ET provisionner, dans ce job, un Supabase local
  # (`supabase db start`) + `.env.local` avant `pnpm test:e2e`.
  e2e:
    name: Tests E2E Playwright
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && vars.RUN_E2E_PLAYWRIGHT == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Scopé à apps/web (comme le smoke) : `@playwright/test` n'est pas à la
      # racine du workspace.
      - run: pnpm -C apps/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
