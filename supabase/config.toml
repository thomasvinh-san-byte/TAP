project_id = "saas-tap"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

# Limitation native du fournisseur d'auth (par origine réseau / IP, par tranche
# de 5 minutes). Rendue EXPLICITE et versionnée ici (« vérifier et resserrer »).
# NOTE DE SÉCURITÉ : cette limite native est (a) par origine seulement — donc
# insuffisante sous sortie réseau partagée (974) et contournable en variant
# d'origine — et (b) connue pour ne pas toujours appliquer le seuil de façon
# fiable. Elle n'est donc qu'un PLANCHER : la protection autoritaire est la
# limitation APPLICATIVE par compte + origine (table public.login_attempts,
# migration 20260613000022, appelée dans signInAction avant la vérification du
# mot de passe). On garde un seuil par IP MODÉRÉ pour ne pas pénaliser les
# utilisateurs légitimes derrière une même sortie réseau.
[auth.rate_limit]
# Connexions + inscriptions par IP et par 5 minutes.
sign_in_sign_ups = 30
# Vérifications de jeton (OTP, PKCE) par IP et par 5 minutes.
token_verifications = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = false
